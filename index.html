<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grade Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Шторка з вибором параметрів -->
    <div id="settingsPanel" class="panel expanded">
      <div class="header" id="settingsHeader">
        <span>Налаштування тесту</span>
        <button id="toggleSettings" aria-label="Закрити/Відкрити налаштування">&#9650;</button>
      </div>

      <div class="content">
        <label>
          Кількість питань: 
          <input type="range" id="questionsRange" min="10" max="100" value="20" step="1" />
          <span id="questionsAmount">20</span>
        </label>
        <label>
          Максимальний бал:
          <select id="maxGradeSelect">
            <option value="11">11</option>
            <option value="12" selected>12</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Шторка-згорток -->
    <div id="settingsMinPanel" class="panel collapsed hidden">
      <span id="summaryText">Питань: 20, Макс бал: 12</span>
      <button id="expandSettings" aria-label="Розгорнути налаштування">&#9660;</button>
    </div>

    <!-- Основна область для кнопок -->
    <div id="buttonsContainer"></div>

    <!-- Вивід оцінки -->
    <div id="result">Обери параметри тесту</div>

  </div>

  <script src="script.js"></script>
</body>
</html>
